# Production-style app (nginx serving the build):   docker compose up --build
# Dev server with hot reload (Vite):                docker compose --profile dev up dev
name: curaflow

services:
  web:
    build:
      context: .
      args:
        # Leave unset to use the built-in "/api/v1" path that nginx proxies.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: curaflow-frontend:latest
    container_name: curaflow-frontend
    ports:
      - "${WEB_PORT:-3000}:80"
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-https://curaflow-backend-pfrn.onrender.com}
    extra_hosts:
      # lets BACKEND_ORIGIN=http://host.docker.internal:8000 reach a backend on your machine (Linux too)
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  dev:
    profiles: ["dev"]
    image: node:20-alpine
    container_name: curaflow-frontend-dev
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    ports:
      - "${DEV_PORT:-3000}:3000"
    environment:
      BACKEND_ORIGIN: ${BACKEND_ORIGIN:-https://curaflow-backend-pfrn.onrender.com}
      # Set to "true" if file changes aren't picked up (Docker Desktop on Windows/macOS).
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - node_modules:/app/node_modules # keep container-built modules out of the bind mount

volumes:
  node_modules:
