server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Container health probe (used by the Dockerfile HEALTHCHECK).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ── API ─────────────────────────────────────────────────────────────────────
    # The browser only ever talks to this origin; nginx forwards /api/* to the
    # backend. That makes the backend's CORS_ORIGIN irrelevant, and keeps Render
    # cold-starts (30-60 s on the free tier) from surfacing as CORS errors.
    location /api/ {
        # The proxy_pass line comes from BACKEND_ORIGIN: written at container start
        # by /docker-entrypoint.d/15-backend-proxy.sh. It has no URI part, so the
        # request URI (/api/v1/...) is passed through unchanged.
        include /etc/nginx/backend.inc;

        proxy_http_version 1.1;
        proxy_ssl_server_name on;             # send SNI — required for HTTPS hosts such as Render
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 25m;             # report uploads
    }

    # ── Static app ──────────────────────────────────────────────────────────────
    # Hashed build output never changes under the same name — cache it for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else falls back to index.html so client-side routes (/patients/…) survive a reload.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
